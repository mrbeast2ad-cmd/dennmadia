<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deen Media</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans:wght@400;600&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f5;--card:#fff;--ink:#0b1d33;--mut:#5c6b7a;--em:#0a7a52;--gold:#b88a2a;--navy:#0b1d33;--line:#dfe6e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08121f;--card:#0f2036;--ink:#eef3f0;--mut:#9fb0bf;--line:#1c3350;--em:#25c48a;--gold:#d9b25a}}
:root[data-theme="dark"]{--bg:#08121f;--card:#0f2036;--ink:#eef3f0;--mut:#9fb0bf;--line:#1c3350;--em:#25c48a;--gold:#d9b25a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans',system-ui,sans-serif}
[lang=ur] body{font-family:'Noto Nastaliq Urdu','Noto Sans',serif;line-height:2.1}
h1,h2,h3{font-family:Amiri,serif;margin:0;line-height:1.2}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-family:Amiri,serif;font-size:24px;font-weight:700;color:#e3c274;margin-inline-end:auto}
.logo span{color:#fff;font-weight:400}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select{font:inherit;cursor:pointer}
nav button{background:none;border:0;color:#cfe0d8;padding:8px 12px;border-radius:99px}
nav button.on{background:var(--em);color:#fff}
select{background:#12304f;color:#fff;border:1px solid #2a4a6c;border-radius:8px;padding:6px}
.btn{background:var(--em);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.alt{background:none;color:var(--em);border:1px solid var(--em)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.demo{background:#fff4d6;color:#5a4300;padding:8px 16px;font-size:14px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
section{display:none}section.on{display:block}
.hero{background:linear-gradient(135deg,#06402e,#0b1d33);color:#fff;border-radius:20px;padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;border:2px solid var(--gold)}
.hero h1{font-size:clamp(28px,5vw,44px)}
.hero p{max-width:46ch;color:#d3e4dc}
.hero img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #e3c274}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:6px 14px;border-radius:99px}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.vid{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.th{aspect-ratio:16/9;display:flex;align-items:flex-end;padding:10px;color:#fff;font-family:Amiri,serif;font-size:20px;position:relative}
.th::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;opacity:.85}
.vid div.m{padding:12px}
.vid b{display:block}.vid small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
label{display:block;margin:12px 0 4px;font-weight:600}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:var(--em);transition:width .2s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats div{background:var(--bg);border-radius:12px;padding:14px}.stats b{font:700 26px Amiri,serif;display:block}
dialog{border:0;border-radius:18px;padding:24px;max-width:380px;width:92%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#000a}
.founder{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.founder img{width:min(100%,340px);border-radius:18px;border:2px solid var(--gold)}
.tag{display:inline-block;background:#fff4d6;color:#5a4300;border-radius:6px;padding:1px 8px;font-size:12px}
</style>
</head>

  <div class="logo">Deen <span>Media</span></div>
  <nav id="nav"></nav>
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="ur">اردو</option><option value="ar">العربية</option></select>
  <button class="btn" id="loginBtn"></button>
</header>
<div class="demo" id="demo"></div>

 $("nav").innerHTML=[["home","home"],["upload","upload"],["dash","dash"],["about","about"]].map(([k,v])=>`<button data-go="${k}" class="${cur===k?'on':''}">${t(v)}</button>`).join("");
 $("loginBtn").textContent=user?t("logout"):t("login");$("demo").textContent=t("demo");
 $("hTitle").textContent=t("h");$("hSub").textContent=t("hs");$("hCta").textContent=t("cta");
 $("chips").innerHTML=t("cats").map((c,i)=>`<button class="chip ${i===cat?'on':''}" data-cat="${i}">${c}</button>`).join("");
 $("feed").innerHTML=V.filter(v=>cat===0||v[1]===cat-1+0&&false||T.en.cats[cat]===v[2]).map(v=>`<article class="vid"><div class="th" style="background:linear-gradient(135deg,${v[3]})">${v[2]}</div><div class="m"><b>${v[0]}</b><small>${t("by")} Deen Media · demo</small></div></article>`).join("");
 ["uTitle:uT","l1:l1","l2:l2","l3:l3","pub:pub","draft:draft","aiT:aiT","aiP:aiP","aiB:aiB","dT:dT","s1:s1","s2:s2","s3:s3","s4:s4","s4v:s4v","dNote:dNote","myT:myT","dlgT:dlgT","eml:eml","dlgN:dlgN","cl:cl","fT:fT","fP:fP","fTag:fTag"].forEach(p=>{const[a,b]=p.split(":");$(a).textContent=t(b)});
 $("dWho").textContent=user?t("hi")+user:t("dWho");
 $("mine").innerHTML=mine.length?mine.map(m=>`<p><b>${m.t}</b> <span class="tag">${m.s}</span></p>`).join(""):`<p style="color:var(--mut)">${t("none")}</p>`;
 document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===cur));
}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){cur=g.dataset.go;render();scrollTo(0,0)}const c=e.target.closest("[data-cat]");if(c){cat=+c.dataset.cat;render()}});
$("lang").onchange=e=>{L=e.target.value;render()};
$("loginBtn").onclick=()=>{if(user){user=null;render()}else $("dlg").showModal()};
$("cl").onclick=()=>$("dlg").close();
$("g").onclick=()=>{user="demo.user@gmail.com";$("dlg").close();render()};
$("eml").onclick=()=>{user=$("em").value||"you@example.com";$("dlg").close();render()};
function add(s){const n=$("vt").value.trim()||"Untitled";mine.unshift({t:n,s});render()}
$("draft").onclick=()=>{add("draft");$("umsg").textContent=t("saved")};
$("pub").onclick=()=>{if(!$("vf").files.length){$("umsg").textContent=t("pick");return}let p=0;const iv=setInterval(()=>{p+=10;$("pg").style.width=p+"%";$("umsg").textContent=t("up")+p+"%";if(p>=100){clearInterval(iv);add("published");$("umsg").textContent=t("done")}},150)};
$("aiB").onclick=()=>{const k=$("vt").value.trim()||"Seerah";$("aiO").innerHTML=[`${k}: a beginner's guide`,`5 things to know about ${k}`,`${k} explained simply`].map(x=>`<li>${x}</li>`).join("")};
render();
</script>
</body>
</html>
